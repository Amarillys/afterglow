<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1fb">
<title>千代世界 · Chiyo Sekai</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="world"></canvas>

<div id="whisper" aria-live="polite"></div>
<div id="hint">轻触 · 拖动 · 键盘弹奏</div>

<div id="hud">
  <div class="clock"><span id="clock-time">05:30</span><span id="clock-sub"></span></div>
  <div class="sign">千代世界<span>chiyo sekai</span></div>
  <div class="ctrl">
    <button id="btn-sound" type="button" title="声音" aria-label="声音">
      <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="on" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 7a7.2 7.2 0 0 1 0 10"/><path class="off" d="M16 10l4 4M20 10l-4 4"/></svg>
    </button>
    <button id="btn-full" type="button" title="全屏" aria-label="全屏">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</div>

<div id="gate" role="button" tabindex="0" aria-label="进入">
  <div class="gate-mark"><i></i></div>
  <div class="gate-text">轻触 · 进入</div>
  <div class="gate-sub">touch to begin</div>
  <div class="gate-memory" id="gate-memory"></div>
  <div class="gate-name">千代世界</div>
</div>

<script src="js/core.js"></script>
<script src="js/time.js"></script>
<script src="js/audio/engine.js"></script>
<script src="js/audio/voices.js"></script>
<script src="js/audio/layers.js"></script>
<script src="js/audio/conductor.js"></script>
<script src="js/scene/sky.js"></script>
<script src="js/scene/floor.js"></script>
<script src="js/scene/shards.js"></script>
<script src="js/scene/effects.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
